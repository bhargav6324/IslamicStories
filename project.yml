name: IslamicStories
options:
  bundleIdPrefix: com.islamicstories
  deploymentTarget:
    iOS: "17.0"
targets:
  IslamicStories:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: IslamicStories
        excludes:
          - Resources/Content
      - path: IslamicStories/Resources/Content
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.islamicstories.app
        INFOPLIST_FILE: IslamicStories/Info.plist
        DEVELOPMENT_TEAM: 67H9LYH78R
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"

  IslamicStoriesTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: IslamicStoriesTests
    dependencies:
      - target: IslamicStories
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.islamicstories.app.tests
        DEVELOPMENT_TEAM: 67H9LYH78R
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"

schemes:
  IslamicStories:
    build:
      targets:
        IslamicStories: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - IslamicStoriesTests

  IslamicStories-LocalMock:
    build:
      targets:
        IslamicStories: all
    run:
      config: Debug
      storeKitConfiguration: IslamicStories/Resources/Subscriptions.storekit
    test:
      config: Debug
      storeKitConfiguration: IslamicStories/Resources/Subscriptions.storekit
      targets:
        - IslamicStoriesTests

